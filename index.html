<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nombre y frase</title>
    <link rel="stylesheet" href="https://use.typekit.net/vsp7vcb.css" />
    <link rel="stylesheet" href="https://use.typekit.net/vsp7vcb.css" />

    <style>
      :root {
        --ancho-lienzo: 769;
        --alto-lienzo: 769;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      /* Contenedor que centra y escala el lienzo completo */
      #viewport {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #000;
      }

      /* Lienzo de trabajo fijo: 2560 x 1440 px */
      #lienzo {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 769px;
        height: 769px;
        overflow: hidden;
        transform-origin: center center;
        background: #000;
      }

      /* Video de fondo */
      #video-fondo {
        position: absolute;
        inset: 0;
        width: 769px;
        height: 769px;
        object-fit: cover;
        z-index: 0;
      }

      /* Capa general para el contenido */
      #contenido {
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
      }

      /* Nombre alineado a la izquierda */
      #nombre {
        color: #753806;
        position: absolute;
        left: 187px;
        bottom: 449px;
        width: 398px;
        height: 50px;
        font-size: 46px;
        font-family: "rival-sans", sans-serif;
        font-weight: 600;
        font-style: italic;
        line-height: 1.1;
        text-align: center;
        text-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
      }

      /*
      Caja de la frase.
      display:flex + align-items:center centra el texto verticalmente.
    */
      #caja-frase {
        position: absolute;
        top: 325px;
        right: 27px;
        width: 713px;
        height: 125px;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 15px 12px;
        text-align: center;
      }

      #frase {
        color: #fff;
        font-size: 45px;
        font-family: "jaf-domus", sans-serif;
        font-weight: 700;
        font-style: normal;
        line-height: 1.08;
        overflow-wrap: break-word;
        text-wrap: balance;
        text-align: center;
        text-shadow: 0 3px 11px rgba(0, 0, 0, 0.2);
      }

      #estado {
        position: absolute;
        left: 50%;
        bottom: 40px;
        transform: translateX(-50%);
        padding: 12px 24px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.65);
        color: #fff;
        font-size: 26px;
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      #estado.visible {
        opacity: 0;
      }
    </style>
  </head>

  <body>
    <main id="viewport">
      <section id="lienzo">
        <video id="video-fondo" autoplay muted loop playsinline preload="auto">
          <source src="fondo.mp4" type="video/mp4" />
          Tu navegador no soporta video HTML5.
        </video>

        <div id="contenido">
          <div id="caja-frase">
            <div id="frase">Cargando frase...</div>
          </div>

          <div id="nombre"></div>
          <div id="estado"></div>
        </div>
      </section>
    </main>

    <script>
      const URL_APPS_SCRIPT =
        "https://script.google.com/macros/s/AKfycbyJ5JFUHJ58raugWjFHPIalheMR_H8Hmb4g74yij2oTrTaqk8uIAoiLe9O91ERR8JjQ/exec";

      const ANCHO_LIENZO = 769;
      const ALTO_LIENZO = 769;

      const lienzo = document.getElementById("lienzo");
      const nombreElemento = document.getElementById("nombre");
      const fraseElemento = document.getElementById("frase");
      const estadoElemento = document.getElementById("estado");

      let registros = [];
      let indiceActual = -1;

      /**
       * Escala proporcionalmente el lienzo de 2560 x 1440
       * para que siempre entre completo en la pantalla.
       */
      function ajustarLienzo() {
        const escalaX = window.innerWidth / ANCHO_LIENZO;
        const escalaY = window.innerHeight / ALTO_LIENZO;
        const escala = Math.min(escalaX, escalaY);

        lienzo.style.transform = `translate(-50%, -50%) scale(${escala})`;
      }

      function mostrarEstado(mensaje) {
        estadoElemento.textContent = mensaje;
        estadoElemento.classList.add("visible");
      }

      function ocultarEstado() {
        estadoElemento.classList.remove("visible");
      }

      /**
       * Normaliza distintas formas posibles del JSON:
       * {nombre, frase}, {Nombre, Frase}, etc.
       */
      function normalizarRegistro(registro) {
        return {
          nombre: registro.nombre ?? registro.Nombre ?? registro.NOMBRE ?? "",
          frase: registro.frase ?? registro.Frase ?? registro.FRASE ?? ""
        };
      }

      /**
       * Selecciona un registro aleatorio evitando repetir
       * inmediatamente el mismo, cuando hay más de uno.
       */
      function obtenerRegistroAleatorio() {
        if (registros.length === 0) {
          return null;
        }

        if (registros.length === 1) {
          indiceActual = 0;
          return registros[0];
        }

        let nuevoIndice;

        do {
          nuevoIndice = Math.floor(Math.random() * registros.length);
        } while (nuevoIndice === indiceActual);

        indiceActual = nuevoIndice;
        return registros[nuevoIndice];
      }

      function mostrarRegistro(registro) {
        if (!registro) {
          nombreElemento.textContent = "";
          fraseElemento.textContent = "No hay frases aprobadas.";
          return;
        }

        nombreElemento.textContent = registro.nombre;
        fraseElemento.textContent = registro.frase;
      }

      async function cargarDatos() {
        mostrarEstado("Cargando información...");

        try {
          const respuesta = await fetch(URL_APPS_SCRIPT, {
            method: "GET",
            cache: "no-store"
          });

          if (!respuesta.ok) {
            throw new Error(`Error HTTP ${respuesta.status}: ${respuesta.statusText}`);
          }

          const datos = await respuesta.json();

          if (!Array.isArray(datos)) {
            throw new Error("La respuesta de Apps Script no es un arreglo JSON.");
          }

          registros = datos.map(normalizarRegistro).filter((registro) => registro.frase.trim() !== "");

          mostrarRegistro(obtenerRegistroAleatorio());
          ocultarEstado();
        } catch (error) {
          console.error("No fue posible cargar los datos:", error);

          nombreElemento.textContent = "";
          fraseElemento.textContent = "No fue posible cargar la información.";

          mostrarEstado("Verifica la URL, los permisos del Web App y la conexión.");
        }
      }

      window.addEventListener("resize", ajustarLienzo);

      ajustarLienzo();
      cargarDatos();

      /*
      Actualiza el contenido cada 180 segundos.
      Puedes cambiar 180000 por otro intervalo en milisegundos.
    */
      setInterval(cargarDatos, 5000);
    </script>
  </body>
</html>
